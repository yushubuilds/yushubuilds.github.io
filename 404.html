<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost in the map · Yushu Singh</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230B0B0C'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23C9A96E' stroke-width='1.5'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Georgia,serif' font-size='22' fill='%23C9A96E'%3EYS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0B0B0C; --gold:#C9A96E; --gold-light:#E8D5A8; --gold-deep:#9C7C45; --text:#ECE7DD; --muted:#8F8A80; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:grid; place-items:center; text-align:center; padding:2rem;
    background:radial-gradient(ellipse at 50% 40%, rgba(201,169,110,.10), transparent 60%), var(--ink);
    color:var(--text); font-family:'Jost',sans-serif; font-weight:300;
  }
  .mono {
    width:72px; height:72px; margin:0 auto 2.5rem; border:1px solid var(--gold); border-radius:50%;
    display:grid; place-items:center; font-family:'Bodoni Moda',serif; font-size:1.6rem; color:var(--gold); letter-spacing:.05em;
  }
  .label { font-size:.72rem; letter-spacing:.35em; text-transform:uppercase; color:var(--gold); margin-bottom:1.25rem; }
  h1 {
    font-family:'Bodoni Moda',serif; font-weight:300; font-size:clamp(5rem,18vw,10rem); line-height:1;
    background:linear-gradient(135deg,var(--gold-deep),var(--gold-light) 50%,var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.lead { font-family:'Bodoni Moda',serif; font-style:italic; font-size:clamp(1.3rem,3vw,1.8rem); margin:1rem 0 .75rem; }
  p.sub { color:var(--muted); max-width:28rem; margin:0 auto 2.5rem; line-height:1.7; }
  a.btn {
    display:inline-block; padding:.9rem 2.2rem; border:1px solid var(--gold); color:var(--gold); text-decoration:none;
    font-size:.75rem; letter-spacing:.3em; text-transform:uppercase; transition:background .3s, color .3s;
  }
  a.btn:hover, a.btn:focus-visible { background:var(--gold); color:var(--ink); outline:none; }
  .rule { width:60px; height:1px; background:var(--gold); opacity:.5; margin:3rem auto 0; }
</style>
</head>
<body>
  <main>
    <div class="mono" aria-hidden="true">YS</div>
    <div class="label">Error · Page not found</div>
    <h1>404</h1>
    <p class="lead">You've wandered off the map.</p>
    <p class="sub">This area hasn't been unlocked yet. Head back to base and keep exploring.</p>
    <a class="btn" href="/">Return home</a>
    <div class="rule"></div>
  </main>
</body>
</html>
